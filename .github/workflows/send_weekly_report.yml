name: 样稿周报推送

on:
  # 每周一 北京时间 10:05（UTC 02:05）
  # 避开整点，减少 GitHub 排队延迟
  schedule:
    - cron: '5 2 * * 1'
  # 支持手动触发（调试用）
  workflow_dispatch:

jobs:
  sync-and-send:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 拉取代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 同步飞书多维表数据
        env:
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          OUTPUT_PATH: sample_production.json
        run: python sync_sample_production.py

      - name: 推送周报到飞书群
        env:
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
          FEISHU_APP_ID: ${{ secrets.FEISHU_APP_ID }}
          FEISHU_APP_SECRET: ${{ secrets.FEISHU_APP_SECRET }}
          DATA_FILE: sample_production.json
        run: python send_weekly_report.py

      - name: 回写数据文件（供网页展示）
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sample_production.json
          if git diff --staged --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 更新样稿数据 $(TZ='Asia/Shanghai' date +%Y-%m-%d)"
            git push
          fi
